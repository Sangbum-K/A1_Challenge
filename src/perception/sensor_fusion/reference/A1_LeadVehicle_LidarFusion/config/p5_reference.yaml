# 룰베이스 브레이크 파라미터 (F2_RuleBased_Design.html 7장).
# 표시: [선배] 선배 원본 값 · [실차] 실차용 변경 · [미정] 측정 후 결정
p5:
  time_headway_s: 2.0      # [선배] T_h
  standstill_gap_m: 7.0    # [선배] s_min
  log_alpha_m: 6.0         # [선배] α (SCC_LOG_ALPHA)
  log_v0_mps: 5.0          # [선배] v_0 (SCC_LOG_V0)
  max_accel_mps2: 5.0      # [선배] A_max
  max_decel_mps2: 20.0     # [선배] D_max
  dt_s: 0.1                # [선배] Δt
  steps: 40                # [선배] N (4 s)
  horizon_s: 1.0           # [실차] t_H, a_P5 = (u_H - u_0) / t_H
gate:
  threshold_logit: 0.3     # [선배] θ (sim A2 기준, 실차 로그로 재확인 필요)
  scale: 5.0               # [선배] κ
  ema: 0.7                 # [선배] β, A2 프레임마다
  initial: 0.0             # [실차] g_0
vrel_mode: track           # [실차] track(트래킹 앞차 vy, 없으면 ḋ→A2, 2026-10-07) | min(v_rel, ḋ) | a2 | ddot
ddot_window_s: 1.0         # [실차] ḋ 최소제곱 기울기 창
ddot_min_samples: 8
a_f1_mps2: 0.0             # [미정] F1 미확정 → 0 (현재 속도 유지)
acc_cmd_min_mps2: -3.0     # [실차] ACC_Cmd 0x157 범위
acc_cmd_max_mps2: 1.0
what_if_kph: [10, 20, 30, 40, 50]   # [실차] 정지 시험용 가상 자차속도
