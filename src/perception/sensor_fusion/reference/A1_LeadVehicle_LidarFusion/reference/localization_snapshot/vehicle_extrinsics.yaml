# Measured sensor mounting poses relative to base_link (REP-103: x forward,
# y left, z up). Translations in meters, angles in degrees, applied as
# fixed-axis roll, pitch, yaw.
#
# All values are null until measured: vehicle_tf.launch.py and gnss.launch.py
# refuse to start while any value is null.
#
# base_link origin: HESAI LIDAR중심, 차량 축 기준(전방 x, 좌측 y, 상방 z)
base_link_to_ins:            
  # Applanix output point as configured on the device (not shifted to base_link).
  frame_id: ins
  x: -0.36
  y: 0.0
  z: -0.25
  roll: 0
  pitch: 0
  yaw: 0

base_link_to_lidar:
  frame_id: hesai_lidar
  x: 0
  y: 0
  z: 0
  roll: 0
  pitch: 0
  yaw: 90.0