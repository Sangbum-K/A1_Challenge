[DefaultSection]
# =====================================================================
# SCC Controller Imitator 기본 설정
# controller_imitator/config/multi_output_config.ini 의 계약을 그대로 따르고,
# 이미지 입력 / SCC(종방향) 전용 옵션을 추가한다.
# =====================================================================

# ---------------- 데이터 ----------------
# data_root 는 전처리 결과(.pkl + 동기 .jpg)가 모인 디렉터리 패턴이어야 한다.
; data_root = /home/ailab-12/AILabDataset/02_Custom_Dataset/35_e2e_morai/scc_controller_imitator/data_v0511/*.pkl

# 이미지 파일명 템플릿. {sample_stem} 은 .pkl 의 stem.
image_glob_template = {sample_stem}.jpg

# ---------------- 출력 디렉터리 ----------------
; output_dir = /home/ailab-12/AILabDataset/03_Shared_Repository/jiwon/scc_controller_imitator/outputs_multi
; suffix = debug

# ---------------- 학습 타겟 (SCC: accel_brake 고정) ----------------
target = accel_brake
output_shape = control          ; control | control_ego

# ---------------- 모델 ----------------
# 지원 모델: ImageEgoSCCPredictor | ImageTrajEgoSCCPredictor
model_name = ImageEgoSCCPredictor

# 이미지 인코더
img_pretrained = True
img_feature_dim = 256

# 공용 hidden
hidden_dim = 256
pred_first_only = False

# ---------------- Trajectory 입력 (ImageTrajEgoSCCPredictor 사용 시) ----------------
include_speed_profile = True
input_time_to_traj = rel_time       ; none | abs_time | rel_time
input_trajectory = relative_trajectory
input_pred_idx_list = 0,1,6,11,16,21,26
output_pred_idx_list = 0,1,6,11,16,21,26

# ---------------- Ego state ----------------
lstm_input_ego_size = 6

# ---------------- 시퀀스 ----------------
tfr_seq_length = 40

# ---------------- 최적화 ----------------
optimizer = adamW
lr = 0.0001
epochs = 200
batch_size = 64                  ; 이미지가 들어가므로 multi_output 대비 작게
scheduler = multistep
step_size = 10
gamma = 0.5
milestones = 120, 160, 190
eta_min = 0.00000001
t_max = 10
T_0 = 20
T_mult = 1
eta_max = 0.001
T_up = 3

# ---------------- 손실 ----------------
loss_type = mse
loss_weight_accel_brake = 1.0
loss_weight_mpc_prediction = 1.0
loss_weight_mpc_control_similarity = 1.0

# ---------------- Wandb ----------------
; wandb_key =
wandb_project = SCC-Controller-Imitator
wandb_entity = hmg_e2e_controller_imitator
