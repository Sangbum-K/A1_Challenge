; ===========================================================================
; MORAI Simulator v2 (Unreal) Bridge Configuration
; Key names must match exactly what vehicle_control_node / vehicle_driver_node parse.
;
; IP mapping:
;   source      = 192.168.137.1  (MORAI simulator)
;   destination = 192.168.137.2  (this machine)
;
; Port ranges:
;   19000–19099  Camera streams  (sim → us)
;    9900–9999   Vehicle / Object / Transform  (sim ↔ us)
;    9000–9099   Control commands  (us → sim)
; ===========================================================================

[MoraiBridge]
morai_simulator_version      = 2            ; 1=Unity (old), 2=Unreal (new)
communication_pubsubser_type = udp          ; vehicle/object state reception
communication_control_type   = ros          ; vehicle control command sending
udp_source_ip                = 10.0.0.10
udp_destination_ip           = 10.0.0.20
; udp_source_ip                = 192.168.137.1
; udp_destination_ip           = 192.168.137.2

; ---------------------------------------------------------------------------
; Object / Traffic Light  (sim → us)
; ---------------------------------------------------------------------------
[MoraiObjectDriver]
udp_object_source_port             = 7076   ; ObjectDetectGT: sim sends FROM
udp_object_destination_port        = 7076   ; ObjectDetectGT: we receive ON
udp_traffic_light_source_port      = 9903   ; TrafficLight:   sim sends FROM
udp_traffic_light_destination_port = 9903   ; TrafficLight:   we receive ON
udp_morai_ros_republish            = 0

; ---------------------------------------------------------------------------
; Vehicle Control  (us → sim)
; ---------------------------------------------------------------------------
[MoraiVehicleControl]
; control_type: 1=Throttle/Brake pedal, 2=Velocity, 3=Acceleration
control_type                          = 1
max_accel                             = 5.0
max_decel                             = -10.0
udp_ego_ctl_source_port               = 9091  ; CtrlCmd:         we send FROM
udp_ego_ctl_destination_port          = 9091  ; CtrlCmd:         sim receives ON
udp_turn_signal_lamp_source_port      = 9095  ; TurnSignal:      we send FROM
udp_turn_signal_lamp_destination_port = 9095  ; TurnSignal:      sim receives ON
udp_morai_ros_multi_publish           = 0
udp_morai_autonomous_mode = 1
; sim_steer_display_type: 0 = nomalized range(-1.0 ~ 1.0), 1 = tire steering angle (rad), 2 = tire steering angle (deg)
sim_steer_display_type                = 0
sim_steer_range_max                   = 25.0

; ---------------------------------------------------------------------------
; Vehicle State  (sim → us)
; ---------------------------------------------------------------------------
[MoraiVehicleDriver]
use_noisy_vehicle                        = 0
use_morai_enu_position                   = 0
; sim_steer_display_type: 0 = nomalized range(-1.0 ~ 1.0), 1 = tire steering angle (rad), 2 = tire steering angle (deg)
sim_steer_display_type                   = 0
sim_steer_range_max                      = 25.0
cg_position_x_from_rear                  = 0.9021
udp_vehicle_info_source_port             = 9090  ; VehicleInfo: sim sends FROM  [fixed_step: 9910→A1_Rule, 9909→MoraiDataSaver / variable: 9909]
udp_vehicle_info_destination_port        = 9090  ; VehicleInfo: we receive ON    [variable 모드 단독 실행 시 9909로 복구]
udp_vehicle_noisy_info_source_port       = 9919  ; VehicleInfoNoisy: sim sends FROM
udp_vehicle_noisy_info_destination_port  = 9919  ; VehicleInfoNoisy: we receive ON
udp_gps_source_port                      = 9906  ; TransformControl: sim sends FROM
udp_gps_destination_port                 = 9906  ; TransformControl: we receive ON
udp_morai_ros_republish                  = 0

; ---------------------------------------------------------------------------
; Camera Streams  (sim → us, 5 cameras, port pattern: 19091 + 2n)
; ---------------------------------------------------------------------------
[MoraiCameraDriver]
num_of_camera                       = 5
publish_raw_image                   = 1
publish_compressed_image            = 1
udp_camera_driver_source_ports      = 9001, 9002, 9003, 9004, 9005
udp_camera_driver_destination_ports = 9001, 9002, 9003, 9004, 9005
camera_topic_name_list              = app/perc/camera_1, app/perc/camera_2, app/perc/camera_3, app/perc/camera_4, app/perc/camera_5
camera_topic_frame_id_list          = camera_1, camera_2, camera_3, camera_4, camera_5

; ---------------------------------------------------------------------------
; Simulation Location  (GPS reference for coordinate projection)
; ---------------------------------------------------------------------------
[MoraiSimLocation]
; proj_mode: local_cartesian (recommended) or utm
proj_mode = utm
; use_morai_enu_position is in [MoraiVehicleDriver]:
;   0 = ENU->WGS84->local_cartesian, 1 = use ENU directly

; GPS origin: should match raceline_optimizer reference_point.json.
; To switch tracks, toggle the comments below — tools/a1_sim.sh reads the
; first active location/ref_lat/ref_lon and passes them to simulator.launch.
location  = sangam
ref_lat   = 37.58336692
ref_lon   = 126.88224248
; location  = speedway
; ref_lat   = 37.29695047
; ref_lon   = 127.21141031