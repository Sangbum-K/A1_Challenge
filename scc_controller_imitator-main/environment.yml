# SCC Controller Imitator 용 conda 환경 정의.
# 기존 ml_con 환경을 그대로 재사용해도 무방하다. 별도 격리가 필요하면 아래로 생성:
#   conda env create -f environment.yml
#   conda activate scc_ml_con

name: scc_ml_con
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.4.*
  - torchvision=0.19.*
  - pytorch-cuda=12.1
  - numpy
  - pandas
  - scipy
  - matplotlib
  - tqdm
  - pillow
  - opencv
  - psutil
  - pip:
      - wandb>=0.16
      - configparser
      - timm>=1.0           # 이미지 백본 팩토리 (resnet18 / efficientnet_b0 / efficientnetv2_s / ...)
