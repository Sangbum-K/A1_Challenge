site_name: scc_controller_imitator — A1 CHALLENGE
site_url: https://ailab-hanyang.github.io/scc_controller_imitator/
site_description: Hanyang AutoHYU · controller_imitator (camera + ego + raceline → steer/pedal)
site_author: Hanyang AutoHYU
repo_url: https://github.com/ailab-hanyang/scc_controller_imitator
repo_name: ailab-hanyang/scc_controller_imitator
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Noto Sans KR
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  favicon: figs/detector_improvement_proposal.png

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: [ko, en]

nav:
  - Home: README.md
  - A1 본선:
      - 발표 보고서 (6/2): A1_REPORT_PRESENTATION_2026-06-02.md
      - 제출 보고서 (5/27): A1_SUBMISSION_REPORT_2026-05-27.md
      - Architecture: ARCHITECTURE.md
      - Training: TRAINING.md
      - Testing: TESTING.md
      - ACC test branch: ACC_TEST_BRANCH.md
  - 회고 / Lessons:
      - 9일 회고 (정본): BLOG_READABLE_2026-05-19_to_28.md
      - 9일 회고 (밀집): BLOG_2026-05-19_to_28.md
      - Chronicle (outline + 부록): CHRONICLE_2026-05-19_to_28.md
      - State and Lessons: STATE_AND_LESSONS.md
      - Model audit (5/26): MODEL_AUDIT_2026-05-26.md
      - Module experiment history: MODULE_EXPERIMENT_HISTORY.md
  - 데이터:
      - 인벤토리: DATA_INVENTORY.md
      - 파이프라인: DATA_PIPELINE.md
      - 파이프라인 용어집: DATA_PIPELINE_GLOSSARY.md
      - 재생성 가이드: DATA_REGENERATION.md
      - 자동화 plan: DATA_AUTOMATION_PLAN.md
      - 상태 (5/27): DATA_STATUS_2026-05-27.md
  - 실험 / 진행:
      - Experiment digest 5/22-26: EXPERIMENT_DIGEST_2026-05-22_26.md
      - Session digest 5/27: SESSION_DIGEST_2026-05-27.md
      - Report prof635 v5: REPORT_prof635_v5.md
      - Report seg backbone lite: REPORT_seg_backbone_lite.md
      - TODO ideas: TODO_IDEAS.md
  - 논문 / 연구:
      - Lab dataset paper proposal: PAPER_PROPOSAL_LAB_DATASET.md
      - 연구 발전 방안 (5/27): RESEARCH_DEVELOPMENT_2026-05-27.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ailab-hanyang/scc_controller_imitator
  generator: false

copyright: Hanyang AutoHYU · Hanyang AILab
