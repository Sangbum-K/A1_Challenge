# scc_controller_imitator a_2 학습용 conda env (sif 빌드 input).
# base image: nvidia/cuda:11.8.0-cudnn8-devel-ubuntu22.04 (torch cu118 매칭).
# 학습 의존성만 — acados/hpipm/ros(closed_loop·mpc 용)는 제외해 sif 경량화.
name: scc_train
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.4.0
    - torchvision==0.19.0
    - timm==1.0.26
    - numpy==2.4.4
    - scipy==1.15.2
    - opencv-python-headless==4.10.0
    - matplotlib==3.10.1
    - pyyaml==6.0.3
    - tqdm==4.67.3
    - pillow==11.1.0
