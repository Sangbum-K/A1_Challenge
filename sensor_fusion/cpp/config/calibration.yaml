# One source for camera and LiDAR geometry, read by every node of this package.
# Nominal values, NOT measured calibration. See docs/CALIBRATION_KR.md.
/**:
  ros__parameters:
    # xyz, roll, pitch, yaw (radians) of the LiDAR in the vehicle reference frame.
    # User confirmed 2026-11-03: LiDAR -Y is vehicle forward, +Z up.
    # Translation from a1_gnss_bringup/config/vehicle_extrinsics.yaml.
    base_from_lidar: [1.16, 0.0, 1.20, 0.0, 0.0, 1.5707963267948966]
    # Camera position relative to LiDAR origin, in forward/left/up axes.
    # User: camera 0.80 m forward, 0.30 m below LiDAR. Lateral offset assumed 0.
    camera_position_m: [0.8, 0.0, -0.3]
    camera_rpy_rad: [0.0, 0.0, 0.0]
    camera_fx: 640.0
    camera_fy: 640.0
    camera_cx: 640.0
    camera_cy: 360.0
    # k1, k2, p1, p2
    camera_distortion: [0.0, 0.0, 0.0, 0.0]
    calibration_verified: false
    clock_verified: false
