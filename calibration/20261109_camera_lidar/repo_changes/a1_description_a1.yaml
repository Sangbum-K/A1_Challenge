# A1 차량 상수의 단일 출처. 다른 패키지는 여기 값을 파라미터로 받고 복사하지 않는다.
# 읽는 곳: a1_description/vehicle.py (load_vehicle)
#          a1_description/extrinsics.py (load_extrinsics)

vehicle:
  # 축거 L. 출처: docs/bsw/a1_vehicle_characteristics.md (업체 제원)
  wheelbase_m: 2.36
  # 앞바퀴 조향각 한계 [deg]. 조향 명령(/control/steering_command)의 °와 같은 뜻이다(B안, 2026-11-08).
  # 잠정. 정지 상태 실제 앞바퀴 각도(좌우 평균). 근거: 담당자 정지 측정 약 20°(기록 없음), 10-08 업체 그래프.
  # 실차 B1 블록(reports_local/2026-11-08/steer_test_blocks.md)에서 확정
  max_steer_tire_deg: 20.0
  # DBC 핸들각 명령 한계. can_guard --steer-limit-deg 와 같아야 한다
  steer_wheel_limit_deg: 150.0
  # 핸들각 / 앞바퀴각(정적). 잠정. 정지 상태 실제 앞바퀴 각도(좌우 평균) 기준.
  # 근거: 담당자 정지 측정 약 20°(기록 없음), 10-08 업체 그래프. 실차 B1 블록(reports_local/2026-11-08/steer_test_blocks.md)에서 확정
  steer_ratio: 7.5
  # 경로 계획용 제약 [deg]. 2026-11-04 GNSS 요레이트 역산(6.7 km/h, 우 핸들 −145°).
  # 미끄럼 포함 유효값이라 명령 변환에 쓰지 않는다. B4 블록에서 확정
  low_speed_effective_steer_deg: 11.5
  # 경로 계획용 제약 [m]. 뒷바퀴 축 중심 기준 최소 회전 반경 = wheelbase_m / tan(low_speed_effective_steer_deg).
  # 2026-11-04 GNSS 요레이트 역산(6.7 km/h, 우 핸들 −145°). 미끄럼 포함 유효값이라 명령 변환에 쓰지 않는다. B4 블록에서 확정
  min_turn_radius_m: 11.6
  # 11-04 실측, 가속 100 %
  max_accel_mps2: 0.57
  # 11-04 실측
  steering_dead_time_s: 0.175

frames:
  map: map
  odom: odom
  # 뒷바퀴 축 중심을 지면에 내린 점 (z = 0)
  base_link: base_link

# base_link 기준 센서 장착 위치 (REP-103: x 앞, y 왼쪽, z 위).
# 길이 m, 각도 deg (고정축 roll, pitch, yaw).
# 값이 null(미실측)이면 vehicle_tf.launch.py 와 gnss_bringup.launch.py 가
# 시작을 거부한다.
extrinsics:
  base_link_to_ins:
    # Applanix 출력점 (장치 설정값 그대로, base_link 로 옮기지 않음). 10-06 실측
    frame_id: ins
    x: 0.84
    y: 0.0
    z: 0.50
    roll: 0
    pitch: 0
    yaw: 0
  base_link_to_lidar:
    # z축 +90° 회전 장착: LiDAR x = 차량 왼쪽, y = 뒤, z = 위. 10-06 실측
    frame_id: hesai_lidar
    x: 1.16
    y: 0
    z: 1.20
    roll: 0
    pitch: 0
    yaw: 90

# lidar_body는 LiDAR 원점의 전방/좌측/상방 축이다. rpy는 카메라 몸체(x 앞, y 왼쪽, z 위) 기준.
perception:
  camera_in_lidar_body:
    # 2026-11-09 실내 주차장 보정. direct_visual_lidar_calibration(NID), bag 1개(차를 밀며 32 s),
    # intrinsic은 camera_bringup/config/camera_info_1280x720.yaml. 초기값 6개 중 3개가 이 값으로 수렴(퍼짐 1 mm, 0.01°),
    # 나머지는 NID가 더 높은 국소해. 이전 명목값은 xyz [0.8, 0, -0.3], rpy [0, 0, 0] (perception_sangbum 원본).
    # 원거리(40 m 이상) 정합은 아직 확인하지 않았다.
    xyz_m: [1.021, -0.035, -0.369]
    rpy_deg: [-0.62, 0.63, -2.09]
    frame_id: hikrobot_camera_vis
  front_bumper_x_m: 0.0   # 원본 진단용 가정. base_link 기준 실측 필요
  geometry_verified: false
